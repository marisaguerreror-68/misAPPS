plugins {
    id 'com.android.application'
}

android {
    namespace 'es.padi.interinos'
    compileSdk 34

    defaultConfig {
        applicationId 'es.padi.interinos'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Sin dependencias externas: solo APIs del sistema Android.
